<!DOCTYPE html>
<html>
<head>
    <title>Shader Introspection System Test</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            background: #1a1a1a;
            color: #eee;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #004400;
            border: 1px solid #008800;
        }
        .error {
            background: #440000;
            border: 1px solid #880000;
        }
        .info {
            background: #004444;
            border: 1px solid #008888;
        }
        #console {
            background: #000;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Shader Introspection System Test</h1>
    <p>This page tests the basic functionality of the Runtime Shader Introspection System.</p>
    
    <div id="test-results"></div>
    
    <h3>Console Output:</h3>
    <div id="console"></div>
    
    <script type="module">
        // Simple console capture
        const consoleDiv = document.getElementById('console');
        const resultsDiv = document.getElementById('test-results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }
        
        function addConsole(message) {
            consoleDiv.innerHTML += message + '\n';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        // Override console
        const originalConsole = { ...console };
        console.log = (...args) => {
            originalConsole.log(...args);
            addConsole('LOG: ' + args.join(' '));
        };
        console.error = (...args) => {
            originalConsole.error(...args);
            addConsole('ERROR: ' + args.join(' '));
        };
        
        // Test the introspection system
        async function runTests() {
            addResult('Starting Shader Introspection System tests...', 'info');
            
            // Check WebGPU support
            if (!navigator.gpu) {
                addResult('✗ WebGPU not supported in this browser', 'error');
                return;
            }
            addResult('✓ WebGPU supported', 'success');
            
            try {
                // Get adapter and device
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    addResult('✗ No WebGPU adapter found', 'error');
                    return;
                }
                addResult('✓ WebGPU adapter obtained', 'success');
                
                const device = await adapter.requestDevice();
                addResult('✓ WebGPU device obtained', 'success');
                
                // Test basic introspection functionality
                console.log('Testing ShaderIntrospector class...');
                
                // Inline the ShaderIntrospector class for testing
                class ShaderIntrospector {
                    constructor(device, options = {}) {
                        this.device = device;
                        this.options = options;
                        this.slotCount = options.slotCount ?? 1024;
                        this.bufferSize = this.slotCount * 32;
                        this.lastParsed = [];
                        this.pollingHandle = null;

                        this.introspectBuffer = device.createBuffer({
                            size: this.bufferSize,
                            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
                            label: 'introspectBuffer'
                        });

                        this.readbackBuffer = device.createBuffer({
                            size: this.bufferSize,
                            usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
                            label: 'introspectReadback'
                        });
                    }
                    
                    getStorageBuffer() { return this.introspectBuffer; }
                    
                    encodeCopy(encoder) {
                        encoder.copyBufferToBuffer(this.introspectBuffer, 0, this.readbackBuffer, 0, this.bufferSize);
                    }
                    
                    async fetch() {
                        try {
                            await this.readbackBuffer.mapAsync(GPUMapMode.READ);
                            const u8 = new Uint8Array(this.readbackBuffer.getMappedRange());
                            const records = [];
                            const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
                            for (let i = 0; i < this.slotCount; i++) {
                                const base = i * 32;
                                const frame = dv.getUint32(base + 0, true);
                                const errorCode = dv.getUint32(base + 4, true);
                                const subjectId = dv.getUint32(base + 8, true);
                                if (frame === 0 && errorCode === 0 && subjectId === 0) continue;
                                const shader = this.readAscii(u8, base + 12, 8);
                                const stage = this.readAscii(u8, base + 20, 8);
                                const value = dv.getFloat32(base + 28, true);
                                records.push({ frame, errorCode, subjectId, shader, stage, value });
                            }
                            this.readbackBuffer.unmap();
                            this.lastParsed = records;
                            return records;
                        } catch (err) {
                            console.warn('[ShaderIntrospector] fetch failed:', err);
                            try { this.readbackBuffer.unmap(); } catch {}
                            return this.lastParsed;
                        }
                    }
                    
                    readAscii(src, offset, len) {
                        let out = '';
                        for (let i = 0; i < len; i++) {
                            const c = src[offset + i];
                            if (c === undefined || c === 0) break;
                            if (c >= 32 && c < 127) out += String.fromCharCode(c);
                        }
                        return out;
                    }
                    
                    attachDebugPanel(containerId = 'introspection-panel') {
                        if (typeof document === 'undefined') return;
                        let el = document.getElementById(containerId);
                        if (!el) {
                            el = document.createElement('div');
                            el.id = containerId;
                            Object.assign(el.style, {
                                position: 'fixed', top: '8px', right: '8px', width: '360px',
                                maxHeight: '340px', overflow: 'auto', background: 'rgba(0,0,0,0.75)',
                                color: '#eee', font: '12px monospace', padding: '8px', border: '1px solid #444',
                                borderRadius: '6px', zIndex: '9999'
                            });
                            document.body.appendChild(el);
                        }
                        const header = document.createElement('div');
                        header.textContent = 'Shader Introspection (live)';
                        header.style.fontWeight = 'bold';
                        el.appendChild(header);
                        const pre = document.createElement('pre');
                        pre.style.marginTop = '6px';
                        el.appendChild(pre);

                        const interval = this.options.pollIntervalMs ?? 500;
                        const maxDisplay = this.options.maxDisplay ?? 50;
                        const tick = async () => {
                            const recs = await this.fetch();
                            const recent = recs.slice(-maxDisplay);
                            pre.textContent = recent.map(r => `F${r.frame} EC${r.errorCode} ID${r.subjectId} ${r.shader}/${r.stage} v=${r.value.toFixed(3)}`).join('\n') || 'No data';
                        };
                        this.pollingHandle = setInterval(tick, interval);
                    }
                    
                    detachDebugPanel() {
                        if (this.pollingHandle) {
                            clearInterval(this.pollingHandle);
                            this.pollingHandle = null;
                        }
                    }
                }
                
                // Create introspector instance
                const introspector = new ShaderIntrospector(device, { slotCount: 16 });
                addResult('✓ ShaderIntrospector instance created', 'success');
                
                // Test buffer access
                const buffer = introspector.getStorageBuffer();
                console.log('Storage buffer label:', buffer.label);
                addResult('✓ Storage buffer accessible', 'success');
                
                // Test copy encoding
                const encoder = device.createCommandEncoder();
                introspector.encodeCopy(encoder);
                addResult('✓ Copy encoding successful', 'success');
                
                // Test fetch
                const commandBuffer = encoder.finish();
                device.queue.submit([commandBuffer]);
                const records = await introspector.fetch();
                console.log('Fetched records:', records.length);
                addResult(`✓ Fetch completed: ${records.length} records`, 'success');
                
                // Test debug panel
                introspector.attachDebugPanel('test-panel');
                addResult('✓ Debug panel attached (check top-right corner)', 'success');
                
                // Clean up after a moment
                setTimeout(() => {
                    introspector.detachDebugPanel();
                    const panel = document.getElementById('test-panel');
                    if (panel) panel.remove();
                    addResult('✓ Debug panel cleaned up', 'success');
                }, 3000);
                
                addResult('✓ All tests passed! Introspection system is working.', 'success');
                
            } catch (error) {
                console.error('Test failed:', error);
                addResult(`✗ Test failed: ${error.message}`, 'error');
            }
        }
        
        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
