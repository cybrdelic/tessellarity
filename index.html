<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU-Ocean</title>
  <style>
    body,
    html {
      height: 100%;
      width: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      margin: 20px;
    }

    #number-container {
      position: fixed;
      top: 0;
      right: 0;
      margin: 20px;
      margin-right: 10px;
      font-size: 15px;
      width: 270px;
    }

    #debug-info {
      position: fixed;
    }

    #howto-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 300px;
      margin: 20px;
      font-size: small;
    }

    #github-link {
      position: fixed;
      bottom: 0;
      right: 0;
    }

    .github-icon {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 40px;
      color: black;
    }

    * {
      user-select: none;
    }

    .appearance-controls {
      background: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .appearance-controls h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    .appearance-controls div {
      margin: 10px 0;
    }

    .appearance-controls label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .appearance-controls input[type="range"] {
      width: 100%;
    }

    .appearance-controls input[type="color"] {
      width: 50px;
      height: 30px;
      padding: 0;
      border: none;
    }
  </style>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>
  <div id="ui-container">
    <div>
      <label>
        <input type="checkbox" id="particle">
        Particles
      </label>
    </div>
    <div id="slider-container">
      <label for="slider" id="slider-label">Box width:</label>
      <input type="range" id="slider" min="0" max="100" value="100" />
      <span id="slider-value"></span>
    </div><!-- Add new water appearance controls -->
    <div id="water-appearance-controls" class="appearance-controls">
      <h3>Water Appearance</h3>
      <div>
        <label for="environment-select">Environment:</label>
        <select id="environment-select">
          <option value="-1">None (White Background)</option>
          <option value="0" selected>Industrial Sunset</option>
          <option value="1">Venice Sunset</option>
          <option value="2">Forest</option>
        </select>
      </div>
      <div>
        <label for="water-color">Water Color:</label>
        <input type="color" id="water-color" value="#3498db" />
      </div>
      <div>
        <label for="transparency">Transparency:</label>
        <input type="range" id="transparency" min="0" max="100" value="80" />
      </div>
      <div>
        <label for="reflectivity">Reflectivity:</label>
        <input type="range" id="reflectivity" min="0" max="100" value="50" />
      </div>
      <div>
        <label for="wave-height">Wave Height:</label>
        <input type="range" id="wave-height" min="0" max="100" value="30" />
      </div>
    </div>
  </div>
  <div id="number-container">
    <b>Simulation Mode</b>
    <form id="simulation-mode" style="display: flex; gap: 10px;">
      <label><input type="radio" name="options" value="mlsmpm" checked>MLS-MPM</label><br>
      <label><input type="radio" name="options" value="sph">SPH</label><br>
      <label><input type="radio" name="options" value="boids">Boids</label><br>
    </form> <b id="particle-count-label">Number of Particles</b>
    <form id="number-button">
      <label><input type="radio" name="options" value="0"><span id="small-value"></span></label><br>
      <label><input type="radio" name="options" value="1" checked><span id="medium-value"></span></label><br>
      <label><input type="radio" name="options" value="2"><span id="large-value"></span></label><br>
      <label><input type="radio" name="options" value="3"><span id="very-large-value"></span></label><br>
    </form>
  </div>
  <div id="howto-container">
    <div> <b>Drag</b> to move camera </div>
    <div> <b>Scroll</b> to zoom in and out </div>
  </div>
  <div id="debug-info">
    <span id="error-reason">loading now...(won't take longer than 10 seconds I guess)</span>
  </div>
  <a href="https://github.com/matsuoka-601/webgpu-ocean" class="github-icon" target="_blank" rel="noopener noreferrer">
    <i class="fab fa-github"></i>
  </a>
  <canvas id="fluidCanvas"></canvas>
  <script type="module" src="main-refactored.ts"></script>
</body>

</html>
